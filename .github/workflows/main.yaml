name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run regression tests
        run: ./build.ps1 test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test/TestResults/*.trx
          if-no-files-found: error

  package:
    needs: test
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build unsigned MSIX bundle
        run: ./build.ps1 build -platform ${{ matrix.platform }}
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: AudioFlip-${{ matrix.platform }}
          path: AppPackages/**/*.msixbundle
          if-no-files-found: error
